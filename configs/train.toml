run_name = "train"

[paths]
data_dir = "data"
artifacts_dir = "artifacts"
runs_dir = "runs"
checkpoints_dir = "checkpoints"

[dataset]
name = "roneneldan/TinyStories"
streaming = true
max_train_examples = 120000
max_validation_examples = 4000
text_key = "text"

[tokenizer]
vocab_size = 8192
min_frequency = 2
special_tokens = ["<pad>", "<bos>", "<eos>", "<unk>"]

[model]
hidden_size = 384
num_layers = 6
num_heads = 6
intermediate_size = 1536
max_seq_len = 256
dropout = 0.1
rope_theta = 10000.0
rms_norm_eps = 1e-5

[training]
seed = 7
batch_size = 4
gradient_accumulation_steps = 8
learning_rate = 0.0002
weight_decay = 0.1
adam_beta1 = 0.9
adam_beta2 = 0.95
warmup_steps = 100
max_steps = 2000
eval_interval = 100
save_interval = 250
log_interval = 10
gradient_clip_norm = 1.0
num_workers = 0
amp = true

[generation]
max_new_tokens = 128
temperature = 0.8
top_k = 50
top_p = 0.95
