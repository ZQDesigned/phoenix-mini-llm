run_name = "dev"

[paths]
data_dir = "data"
artifacts_dir = "artifacts"
runs_dir = "runs"
checkpoints_dir = "checkpoints"

[dataset]
name = "roneneldan/TinyStories"
streaming = true
max_train_examples = 20000
max_validation_examples = 1000
text_key = "text"

[tokenizer]
vocab_size = 4096
min_frequency = 2
special_tokens = ["<pad>", "<bos>", "<eos>", "<unk>"]

[model]
hidden_size = 256
num_layers = 4
num_heads = 4
intermediate_size = 1024
max_seq_len = 128
dropout = 0.1
rope_theta = 10000.0
rms_norm_eps = 1e-5

[training]
seed = 7
batch_size = 8
gradient_accumulation_steps = 2
learning_rate = 0.00025
weight_decay = 0.1
adam_beta1 = 0.9
adam_beta2 = 0.95
warmup_steps = 20
max_steps = 200
eval_interval = 20
save_interval = 50
log_interval = 5
gradient_clip_norm = 1.0
num_workers = 0
amp = false

[generation]
max_new_tokens = 64
temperature = 0.8
top_k = 40
top_p = 0.95
