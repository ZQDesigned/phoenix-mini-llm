site_name: Phoenix Mini LLM
site_description: A beginner-friendly decoder-only language model project built from scratch.
site_url: https://zqdesigned.github.io/phoenix-mini-llm/
repo_url: https://github.com/ZQDesigned/phoenix-mini-llm
repo_name: ZQDesigned/phoenix-mini-llm
edit_uri: edit/main/docs-site/docs/
docs_dir: docs
site_dir: site
strict: true

validation:
  links:
    absolute_links: relative_to_docs

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange

plugins:
  - search
  - minify:
      minify_html: true
  - redirects:
      redirect_maps:
        project-overview.md: index.md
        pitfalls/07-github-pages-subpath-and-base-config.md: pitfalls/06-github-pages-subpath-and-static-site-build.md
        learning/01-what-you-are-building.md: learning/volume-01-orientation/01-what-is-a-language-model.md
        learning/02-python-environment-and-uv.md: tutorials/01-bootstrap-the-project.md
        learning/03-tensors-and-linear-algebra.md: learning/volume-02-mathematical-prerequisites/02-scalars-vectors-matrices-tensors-and-shapes.md
        learning/04-autograd-and-training-loop.md: learning/volume-06-optimization-and-generalization/01-gradients-backpropagation-and-optimization.md
        learning/05-text-to-tokens.md: learning/volume-07-text-and-tokenization/index.md
        learning/06-language-modeling-objective.md: learning/volume-08-language-modeling-as-sequence-prediction/03-why-the-objective-looks-like-a-one-token-shift.md
        learning/07-from-mlp-to-attention.md: learning/volume-09-sequence-modeling-foundations/index.md
        learning/08-transformer-blocks.md: learning/volume-10-sequence-modeling-and-transformers/index.md
        learning/09-assembling-the-model.md: learning/volume-10-sequence-modeling-and-transformers/05-how-a-complete-decoder-only-model-is-assembled.md
        learning/10-training-engineering.md: learning/volume-11-training-a-small-language-model/index.md
        learning/11-inference-and-sampling.md: learning/volume-12-inference-evaluation-and-debugging/index.md
        learning/12-debugging-and-evaluation.md: learning/volume-12-inference-evaluation-and-debugging/index.md
        learning/part-1-orientation/index.md: learning/volume-01-orientation/index.md
        learning/part-2-mathematical-prerequisites/index.md: learning/volume-02-mathematical-prerequisites/index.md
        learning/part-3-functions-calculus-probability-and-information/index.md: learning/volume-03-functions-calculus-probability-and-information/index.md
        learning/part-4-learning-from-data/index.md: learning/volume-04-learning-from-data/index.md
        learning/part-5-neural-networks-and-optimization/index.md: learning/volume-05-neural-networks-and-optimization/index.md
        learning/part-6-optimization-and-generalization/index.md: learning/volume-06-optimization-and-generalization/index.md
        learning/part-4-text-and-tokenization/index.md: learning/volume-07-text-and-tokenization/index.md
        learning/part-8-language-modeling-as-sequence-prediction/index.md: learning/volume-08-language-modeling-as-sequence-prediction/index.md
        learning/part-7-sequence-modeling-foundations/index.md: learning/volume-09-sequence-modeling-foundations/index.md
        learning/part-5-sequence-modeling-and-transformers/index.md: learning/volume-10-sequence-modeling-and-transformers/index.md
        learning/part-6-training-a-small-language-model/index.md: learning/volume-11-training-a-small-language-model/index.md
        learning/part-7-inference-evaluation-and-debugging/index.md: learning/volume-12-inference-evaluation-and-debugging/index.md
        learning/part-8-where-to-go-next/index.md: learning/volume-13-where-to-go-next/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      name: GitHub 仓库
      link: https://github.com/ZQDesigned/phoenix-mini-llm

