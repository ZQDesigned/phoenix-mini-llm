          - 02. 小批量梯度下降、噪声与训练的统计本性: learning/volume-06-optimization-and-generalization/02-mini-batch-gradient-descent-noise-and-why-training-is-statistical.md
          - 03. 过拟合、泛化与验证集: learning/volume-06-optimization-and-generalization/03-overfitting-generalization-and-validation.md
