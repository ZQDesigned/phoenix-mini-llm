          - 02. 为什么应该先做一个小模型: learning/volume-01-orientation/02-why-start-with-a-small-model.md
          - 03. 怎样使用这套知识档案: learning/volume-01-orientation/03-how-to-use-this-book.md
      - 卷二. 数学对象、线性代数与表示空间:
          - learning/volume-02-mathematical-prerequisites/index.md
          - 01. 为什么学语言模型还要先学数学: learning/volume-02-mathematical-prerequisites/01-why-you-still-need-math-for-language-models.md
          - 02. 标量、向量、矩阵、张量与 shape: learning/volume-02-mathematical-prerequisites/02-scalars-vectors-matrices-tensors-and-shapes.md
          - 03. 矩阵乘法、线性变换与维度流动: learning/volume-02-mathematical-prerequisites/03-matrix-multiplication-linear-transformations-and-dimensional-flow.md
          - 04. 长度、点积、相似度与几何直觉: learning/volume-02-mathematical-prerequisites/04-length-dot-products-similarity-and-geometric-intuition.md
      - 卷三. 函数、概率、信息与导数:
          - learning/volume-03-functions-calculus-probability-and-information/index.md
          - 01. 函数、复合与非线性为什么重要: learning/volume-03-functions-calculus-probability-and-information/01-functions-composition-and-why-nonlinearity-matters.md
          - 02. 概率分布、期望与不确定性: learning/volume-03-functions-calculus-probability-and-information/02-probability-distributions-expectation-and-uncertainty.md
